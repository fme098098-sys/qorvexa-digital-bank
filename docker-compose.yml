# Local PostgreSQL for development: `docker compose up -d db`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qorvexa
      POSTGRES_PASSWORD: qorvexa_dev_pw
      POSTGRES_DB: qorvexa
    ports: ["5432:5432"]
    volumes: ["qorvexa_pg:/var/lib/postgresql/data", "./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
volumes:
  qorvexa_pg:
